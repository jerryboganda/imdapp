version: 2
updates:
  # GitHub Actions used by the control plane.
  # Grouped so a round of action bumps arrives as ONE reviewable PR instead of
  # one PR per action (the first run produced eight).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "ci"

  # Site tooling inside the vendored component
  - package-ecosystem: "npm"
    directory: "/open-reverselab/site"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      site-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # MCP server python deps inside the vendored component
  - package-ecosystem: "pip"
    directory: "/open-reverselab/tools/skills/mcp/ReverseLabToolsMCP"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      mcp-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
